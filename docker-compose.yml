# Single-command stack: `docker compose up`. See DESIGN.md §11.
#
# Variable references use `${NAME:-default}` so a clean clone needs no `.env`
# for the happy path. Override individual values via shell env or a `.env`
# file at the repo root (see `.env.example`).

services:
  ollama:
    image: ollama/ollama:latest
    container_name: vd_ollama
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      CHAT_MODEL: ${CHAT_MODEL:-qwen2.5:3b}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
    ports:
      - "11434:11434"
    healthcheck:
      # Both models must be pulled before downstream services consider
      # ollama healthy. Generous start_period covers first-run model pull.
      test: ["CMD-SHELL", "ollama list | grep -q qwen && ollama list | grep -q nomic"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: vd_qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vd_backend
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      CHAT_MODEL: ${CHAT_MODEL:-qwen2.5:3b}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      QDRANT_HOST: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-wiki_article}
      CHUNK_SIZE: ${CHUNK_SIZE:-800}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-120}
      TOP_K: ${TOP_K:-5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import httpx; httpx.get(\"http://localhost:8000/health\").raise_for_status()'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vd_frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  ollama_data:
  qdrant_data:
