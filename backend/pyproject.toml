[project]
name = "wikipedia-rag-chat-backend"
version = "0.1.0"
description = "Backend for a single-page Wikipedia RAG chat app, served by a local LLM."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
    "beautifulsoup4>=4.12",
    "qdrant-client>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "reportlab>=4.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

# --- pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires the live compose stack (skipped by default)",
]
addopts = "-ra --strict-markers --cov=src/app --cov-report=term-missing -m \"not integration\""
asyncio_mode = "auto"

# --- coverage ---------------------------------------------------------------
# The brief permits three exclusion categories: generated boilerplate,
# framework glue, and the entrypoint file. Each line below maps to one of
# them; nothing else is excluded.
[tool.coverage.run]
branch = false
source = ["src/app"]
omit = [
    "src/app/main.py",      # entrypoint file
    "src/app/schemas.py",   # generated boilerplate (Pydantic data classes)
    "src/app/deps.py",      # framework glue (FastAPI DI providers)
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

# --- ruff -------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
